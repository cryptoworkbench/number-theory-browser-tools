<!-- assets/favicon-ring.svg
     Self-contained icon, kept but not linked by any page (assets/favicon.svg
     is the tab icon): the Cyclic Groups
     tool's ring of the additive group mod 12, without its numbers. Twelve
     beads round the circle, 0 at the top, each in its order's colour as
     the tool draws it (the identity grey, the generators 1, 5, 7, 11
     green, 2 and 10 of order 6 purple, 3 and 9 of order 4 pink, 4 and 8 of
     order 3 gold, 6 of order 2 blue), joined by the grey 12-gon, with the
     gold forward path bowing in and the blue backward path bowing out
     between neighbours, on a dark rounded plate as in the tool's night
     view.

     Colors below are copied verbatim from assets/palette.css (its night
     :root tokens), NOT referenced via var() against that file. A favicon
     is fetched by the browser as its own standalone document, so it has
     no access to the host page's CSS custom properties, which makes this
     file the one place on the site exempt from CLAUDE.md's var() only
     color rule. Each literal here must match its palette.css source
     character for character (PAL-02):

       plate          = #191c22  (surface-alt)
       identity, ring = #979eab  (text-dim)
       order 12       = #6fc2a5  (accent-2, role-result)
       order 2, back  = #8ea6de  (accent, role-input)
       order 3, fwd   = #d8b25e  (role-active)
       order 4        = #d08eb4  (role-alt)
       order 6        = #ae9ad8  (role-special)

     The beads' colours are made for a dark ground, so the icon keeps its
     night plate in both colour schemes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .plate { fill: #191c22; }
    .ring { fill: none; stroke: #979eab; stroke-width: 2; stroke-linejoin: round; opacity: .5; }
    .fwd { fill: none; stroke: #d8b25e; stroke-width: 1.3; stroke-linecap: round; }
    .back { fill: none; stroke: #8ea6de; stroke-width: 1.3; stroke-linecap: round; }
    .ord-id { fill: #979eab; }
    .ord-gen { fill: #6fc2a5; }
    .ord-m1 { fill: #8ea6de; }
    .ord-m2 { fill: #d8b25e; }
    .ord-m3 { fill: #d08eb4; }
    .ord-m4 { fill: #ae9ad8; }
  </style>
  <rect class="plate" x="2" y="2" width="60" height="60" rx="14"/>
  <path class="back" d="M32 10.5Q39.64 3.51 42.75 13.38M42.75 13.38Q52.86 11.14 50.62 21.25M50.62 21.25Q60.49 24.36 53.5 32M53.5 32Q60.49 39.64 50.62 42.75M50.62 42.75Q52.86 52.86 42.75 50.62M42.75 50.62Q39.64 60.49 32 53.5M32 53.5Q24.36 60.49 21.25 50.62M21.25 50.62Q11.14 52.86 13.38 42.75M13.38 42.75Q3.51 39.64 10.5 32M10.5 32Q3.51 24.36 13.38 21.25M13.38 21.25Q11.14 11.14 21.25 13.38M21.25 13.38Q24.36 3.51 32 10.5"/>
  <path class="ring" d="M32 10.5L42.75 13.38L50.62 21.25L53.5 32L50.62 42.75L42.75 50.62L32 53.5L21.25 50.62L13.38 42.75L10.5 32L13.38 21.25L21.25 13.38Z"/>
  <path class="fwd" d="M32 10.5Q34.98 20.89 42.75 13.38M42.75 13.38Q40.13 23.87 50.62 21.25M50.62 21.25Q43.11 29.02 53.5 32M53.5 32Q43.11 34.98 50.62 42.75M50.62 42.75Q40.13 40.13 42.75 50.62M42.75 50.62Q34.98 43.11 32 53.5M32 53.5Q29.02 43.11 21.25 50.62M21.25 50.62Q23.87 40.13 13.38 42.75M13.38 42.75Q20.89 34.98 10.5 32M10.5 32Q20.89 29.02 13.38 21.25M13.38 21.25Q23.87 23.87 21.25 13.38M21.25 13.38Q29.02 20.89 32 10.5"/>
  <circle class="bead ord-id" cx="32" cy="10.5" r="3.6"/>
  <circle class="bead ord-gen" cx="42.75" cy="13.38" r="3.6"/>
  <circle class="bead ord-m4" cx="50.62" cy="21.25" r="3.6"/>
  <circle class="bead ord-m3" cx="53.5" cy="32" r="3.6"/>
  <circle class="bead ord-m2" cx="50.62" cy="42.75" r="3.6"/>
  <circle class="bead ord-gen" cx="42.75" cy="50.62" r="3.6"/>
  <circle class="bead ord-m1" cx="32" cy="53.5" r="3.6"/>
  <circle class="bead ord-gen" cx="21.25" cy="50.62" r="3.6"/>
  <circle class="bead ord-m2" cx="13.38" cy="42.75" r="3.6"/>
  <circle class="bead ord-m3" cx="10.5" cy="32" r="3.6"/>
  <circle class="bead ord-m4" cx="13.38" cy="21.25" r="3.6"/>
  <circle class="bead ord-gen" cx="21.25" cy="13.38" r="3.6"/>
</svg>
