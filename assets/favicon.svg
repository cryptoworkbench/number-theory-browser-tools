<!-- assets/favicon.svg
     Self-contained tab-icon asset: a simplified Cayley table (header row
     and header column, three solid diagonal cells, grid lines, outer
     frame) on the rounded accent plate. It is the same mark as the inline
     brand icon in every page's header (assets/site.css .brand-icon-*), with
     the same shape elements and class names.

     Colors below are copied verbatim from assets/palette.css, NOT
     referenced via var() against that file. A favicon is fetched by the
     browser as its own standalone document, so it has no access to the
     host page's CSS custom properties, which makes this file the one
     place on the site exempt from CLAUDE.md's var() only color rule.
     Each literal here must match its palette.css source character for
     character (PAL-02):

       plate (default / root)                    = #8ea6de  (accent token in palette.css :root, night)
       ink   (default / root)                    = #111318  (accent ink token in palette.css :root, night)
       plate (media prefers-color-scheme: light) = #2f4c96  (accent token in palette.css :root[data-theme="day"])
       ink   (media prefers-color-scheme: light) = #ffffff  (accent ink token in palette.css :root[data-theme="day"])

     These values were re-synced in quick task 261006-p2s after palette.css
     had been retuned.

     This follows the operating system's color-scheme preference, not the
     site's own localStorage theme toggle, since a favicon has no access to
     page state. Both variants are independently legible (a light plate
     with near-black table lines and cells at night, a dark plate with
     white ones by day reads clearly against both a white and a dark
     browser tab strip), so the two diverging is purely cosmetic.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --plate: #8ea6de;
      --ink: #111318;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --plate: #2f4c96;
        --ink: #ffffff;
      }
    }
    .brand-icon-plate { fill: var(--plate); }
    .brand-icon-head { fill: var(--ink); opacity: .4; }
    .brand-icon-diag { fill: var(--ink); }
    .brand-icon-grid { fill: none; stroke: var(--ink); stroke-width: 1.5; opacity: .6; }
    .brand-icon-frame { fill: none; stroke: var(--ink); stroke-width: 2.5; }
  </style>
  <rect class="brand-icon-plate" x="2" y="2" width="60" height="60" rx="14"/>
  <rect class="brand-icon-head" x="12" y="12" width="40" height="10"/>
  <rect class="brand-icon-head" x="12" y="22" width="10" height="30"/>
  <rect class="brand-icon-diag" x="22" y="22" width="10" height="10"/>
  <rect class="brand-icon-diag" x="32" y="32" width="10" height="10"/>
  <rect class="brand-icon-diag" x="42" y="42" width="10" height="10"/>
  <path class="brand-icon-grid" d="M22 12V52M32 12V52M42 12V52M12 22H52M12 32H52M12 42H52"/>
  <rect class="brand-icon-frame" x="12" y="12" width="40" height="40"/>
</svg>
