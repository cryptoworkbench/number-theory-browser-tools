<!-- assets/favicon.svg
     Self-contained tab-icon asset: a numbered 1-2-3-4 tile echoing the
     brand glyph already in every page's header link text.

     Colors below are copied verbatim from assets/palette.css, NOT
     referenced via var() against that file. A favicon is fetched by the
     browser as its own standalone document, so it has no access to the
     host page's CSS custom properties, which makes this file the one
     place on the site exempt from CLAUDE.md's var() only color rule.
     Each literal here must match its palette.css source character for
     character (PAL-02):

       plate (default / root)                    = #7c9bff  (root accent token, night)
       ink   (default / root)                     = #0b0e1a  (root accent ink token, night)
       plate (media prefers-color-scheme: light)  = #3457c9  (day-theme accent token)
       ink   (media prefers-color-scheme: light)  = #ffffff  (day-theme accent ink token)

     This follows the operating system's color-scheme preference, not the
     site's own localStorage theme toggle, since a favicon has no access to
     page state. Both variants are independently legible (a light
     periwinkle plate with near-black digits reads clearly against both a
     white and a dark browser tab strip), so the two diverging is purely
     cosmetic.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --plate: #7c9bff;
      --ink: #0b0e1a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --plate: #3457c9;
        --ink: #ffffff;
      }
    }
    rect { fill: var(--plate); }
    text {
      fill: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 26px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="14"/>
  <text x="21" y="26">1</text>
  <text x="43" y="26">2</text>
  <text x="21" y="50">3</text>
  <text x="43" y="50">4</text>
</svg>
