<!-- assets/favicon.svg
     Self-contained tab-icon asset for the whole site: the Cyclic Groups
     card's mark from the home page (index.html .cyc-icon-*), with the same
     shapes and class names: a faint ring, the gold five-pointed star its
     generator's steps trace, four green beads at its points and the grey
     identity at the top, on a rounded plate. The card's 24-unit drawing is
     scaled onto the 64-unit plate. (assets/favicon-ring.svg, the ring of
     the additive group mod 12, is an earlier tab icon, kept but unlinked.)

     Colors below are copied verbatim from assets/palette.css, NOT
     referenced via var() against that file. A favicon is fetched by the
     browser as its own standalone document, so it has no access to the
     host page's CSS custom properties, which makes this file the one
     place on the site exempt from CLAUDE.md's var() only color rule.
     Each literal here must match its palette.css source character for
     character (PAL-02):

       token        night (:root)   day (:root[data-theme="day"])
       surface-alt  #191c22         #f3f4f7   (plate)
       text-dim     #979eab         #566070   (ring, identity)
       text         #e6e8ec         #1b1f27   (identity's outline)
       role-active  #d8b25e         #8f630a   (star)
       accent-2     #6fc2a5         #17785e   (beads; role-result)

     This follows the operating system's color-scheme preference, not the
     site's own localStorage theme toggle, since a favicon has no access to
     page state.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --plate: #191c22;
      --dim: #979eab;
      --text: #e6e8ec;
      --active: #d8b25e;
      --result: #6fc2a5;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --plate: #f3f4f7;
        --dim: #566070;
        --text: #1b1f27;
        --active: #8f630a;
        --result: #17785e;
      }
    }
    .plate { fill: var(--plate); }
    .cyc-icon-ring { fill: none; stroke: var(--dim); stroke-width: .6; opacity: .6; }
    .cyc-icon-chord { fill: none; stroke: var(--active); stroke-width: 1; stroke-linejoin: round; }
    .cyc-icon-bead { fill: var(--result); }
    .cyc-icon-id { fill: var(--dim); stroke: var(--text); stroke-width: .8; }
  </style>
  <rect class="plate" x="2" y="2" width="60" height="60" rx="14"/>
  <g transform="translate(4 4) scale(2.3333)">
    <circle class="cyc-icon-ring" cx="12" cy="12" r="9"/>
    <path class="cyc-icon-chord" d="M12 3L17.29 19.28L3.44 9.22L20.56 9.22L6.71 19.28Z"/>
    <circle class="cyc-icon-bead" cx="20.56" cy="9.22" r="1.7"/>
    <circle class="cyc-icon-bead" cx="17.29" cy="19.28" r="1.7"/>
    <circle class="cyc-icon-bead" cx="6.71" cy="19.28" r="1.7"/>
    <circle class="cyc-icon-bead" cx="3.44" cy="9.22" r="1.7"/>
    <circle class="cyc-icon-id" cx="12" cy="3" r="1.9"/>
  </g>
</svg>
