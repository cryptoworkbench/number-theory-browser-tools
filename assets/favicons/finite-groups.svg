<!-- assets/favicons/finite-groups.svg
     Self-contained tab icon of Finite Groups/finite-groups.html: the mark on that tool's card on
     the home page (index.html .cyc4-icon-*), the ring of <Z/4Z, +> as the
     tool draws it, with the same shapes, class names and styles, the card's
     drawing (viewBox 0 0 24 24) fitted onto a rounded 64-unit plate. The
     former mark, the five-bead star, is kept as
     assets/favicons/finite-groups-star.svg, to switch back to.

     Colors below are copied verbatim from assets/palette.css, NOT
     referenced via var() against that file. A favicon is fetched by the
     browser as its own standalone document, so it has no access to the
     host page's CSS custom properties, which makes the favicons the one
     place on the site exempt from CLAUDE.md's var() only color rule.
     Each literal here must match its palette.css source character for
     character (PAL-02):

       token        night    day
       surface-alt  #191c22  #f3f4f7
       text-dim     #979eab  #566070
       accent       #8ea6de  #2f4c96
       role-active  #d8b25e  #8f630a
       role-alt     #d08eb4  #9c3f74

     This follows the operating system's color-scheme preference, not the
     site's own localStorage theme toggle, since a favicon has no access to
     page state.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --surface-alt: #191c22;
      --text-dim: #979eab;
      --accent: #8ea6de;
      --role-active: #d8b25e;
      --role-alt: #d08eb4;
      --role-input: var(--accent);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --surface-alt: #f3f4f7;
        --text-dim: #566070;
        --accent: #2f4c96;
        --role-active: #8f630a;
        --role-alt: #9c3f74;
      }
    }
    .plate { fill: var(--surface-alt); }
    .cyc4-icon-back{ fill:none; stroke:var(--role-input); stroke-width:.9; stroke-linecap:round; }
    .cyc4-icon-edge{ fill:none; stroke:var(--text-dim); stroke-width:1.1; opacity:.55; stroke-linejoin:round; }
    .cyc4-icon-fwd{ fill:none; stroke:var(--role-active); stroke-width:.9; stroke-linecap:round; }
    .cyc4-icon-id{ fill:var(--text-dim); }
    .cyc4-icon-o4{ fill:var(--role-alt); }
    .cyc4-icon-o2{ fill:var(--role-input); }
  </style>
  <rect class="plate" x="2" y="2" width="60" height="60" rx="14"/>
  <svg class="cyc4-icon" x="7" y="7" width="50" height="50" viewBox="0 0 24 24">
    <path class="cyc4-icon-back" d="M12 5C8.2 1.6 1.6 8.2 5 12M5 12C1.6 15.8 8.2 22.4 12 19M12 19C15.8 22.4 22.4 15.8 19 12M19 12C22.4 8.2 15.8 1.6 12 5"/>
    <path class="cyc4-icon-edge" d="M12 5L5 12L12 19L19 12Z"/>
    <path class="cyc4-icon-fwd" d="M12 5Q11.2 11.2 5 12Q11.2 12.8 12 19Q12.8 12.8 19 12Q12.8 11.2 12 5"/>
    <circle class="cyc4-icon-id" cx="12" cy="5" r="2"/>
    <circle class="cyc4-icon-o4" cx="5" cy="12" r="2"/>
    <circle class="cyc4-icon-o2" cx="12" cy="19" r="2"/>
    <circle class="cyc4-icon-o4" cx="19" cy="12" r="2"/>
  </svg>
</svg>
