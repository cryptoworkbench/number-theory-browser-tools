<!-- assets/favicons/finite-groups.svg
     Self-contained tab icon of Finite Groups/finite-groups.html: the mark on that tool's card on
     the home page (index.html .cyc4-icon-*), the ring of <Z/4Z, +> as the
     tool draws it, its beads coloured by cardinality (the identity grey,
     the generators green, the element of order 2 blue), with the same
     shapes, class names and styles, the card's drawing (viewBox 0 0 24
     24) fitted onto a rounded 64-unit plate. The
     former mark, the five-bead star, is kept as
     assets/favicons/finite-groups-star.svg, to switch back to.

     Colors below are copied verbatim from assets/palette.css, NOT
     referenced via var() against that file. A favicon is fetched by the
     browser as its own standalone document, so it has no access to the
     host page's CSS custom properties, which makes the favicons the one
     place on the site exempt from CLAUDE.md's var() only color rule.
     Each literal here must match its palette.css source character for
     character (PAL-02):

       token        night    day
       surface-alt  #191c22  #f3f4f7
       text-dim     #979eab  #566070
       accent       #8ea6de  #2f4c96
       role-active  #d8b25e  #8f630a
       accent-2     #6fc2a5  #17785e

     This follows the operating system's color-scheme preference, not the
     site's own localStorage theme toggle, since a favicon has no access to
     page state.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --surface-alt: #191c22;
      --text-dim: #979eab;
      --accent: #8ea6de;
      --role-active: #d8b25e;
      --accent-2: #6fc2a5;
      --role-input: var(--accent);
      --role-result: var(--accent-2);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --surface-alt: #f3f4f7;
        --text-dim: #566070;
        --accent: #2f4c96;
        --role-active: #8f630a;
        --accent-2: #17785e;
      }
    }
    .plate { fill: var(--surface-alt); }
    .cyc4-icon-edge{ fill:none; stroke:var(--text-dim); stroke-width:1.4; opacity:.55; stroke-linejoin:round; }
    .cyc4-icon-fwd{ fill:none; stroke:var(--role-active); stroke-width:1.15; stroke-linecap:round; }
    .cyc4-icon-id{ fill:var(--text-dim); }
    .cyc4-icon-gen{ fill:var(--role-result); }
    .cyc4-icon-o2{ fill:var(--role-input); }
  </style>
  <rect class="plate" x="2" y="2" width="60" height="60" rx="14"/>
  <svg class="cyc4-icon" x="7" y="7" width="50" height="50" viewBox="0 0 24 24">
    <path class="cyc4-icon-edge" d="M12 3L3 12L12 21L21 12Z"/>
    <path class="cyc4-icon-fwd" d="M12 3Q11 11 3 12Q11 13 12 21Q13 13 21 12Q13 11 12 3"/>
    <circle class="cyc4-icon-id" cx="12" cy="3" r="2.5"/>
    <circle class="cyc4-icon-gen" cx="3" cy="12" r="2.5"/>
    <circle class="cyc4-icon-o2" cx="12" cy="21" r="2.5"/>
    <circle class="cyc4-icon-gen" cx="21" cy="12" r="2.5"/>
  </svg>
</svg>
