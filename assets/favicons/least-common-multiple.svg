<!-- assets/favicons/least-common-multiple.svg (generated)
     Self-contained tab icon of Least Common Multiple/least-common-multiple.html: the mark on that tool's card on
     the home page (index.html .lcm-icon-*), with the same shapes, class
     names and styles, the card's drawing (viewBox 0 0 24 24) fitted onto a
     rounded 64-unit plate.

     Colors below are copied verbatim from assets/palette.css, NOT
     referenced via var() against that file. A favicon is fetched by the
     browser as its own standalone document, so it has no access to the
     host page's CSS custom properties, which makes the favicons the one
     place on the site exempt from CLAUDE.md's var() only color rule.
     Each literal here must match its palette.css source character for
     character (PAL-02):

       token        night    day
       surface-alt  #191c22  #f3f4f7
       text-dim     #979eab  #566070
       accent       #8ea6de  #2f4c96
       accent-2     #6fc2a5  #17785e
       role-alt     #d08eb4  #9c3f74

     This follows the operating system's color-scheme preference, not the
     site's own localStorage theme toggle, since a favicon has no access to
     page state.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --surface-alt: #191c22;
      --text-dim: #979eab;
      --accent: #8ea6de;
      --accent-2: #6fc2a5;
      --role-alt: #d08eb4;
      --role-result: var(--accent-2);
      --role-input: var(--accent);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --surface-alt: #f3f4f7;
        --text-dim: #566070;
        --accent: #2f4c96;
        --accent-2: #17785e;
        --role-alt: #9c3f74;
      }
    }
    .plate { fill: var(--surface-alt); }
    .lcm-icon-a{ fill:color-mix(in srgb, var(--role-input) 32%, transparent); stroke:var(--role-input); stroke-width:.7; }
    .lcm-icon-b{ fill:color-mix(in srgb, var(--role-alt) 32%, transparent); stroke:var(--role-alt); stroke-width:.7; }
    .lcm-icon-ground{ stroke:var(--text-dim); stroke-width:1; }
    .lcm-icon-meet{ stroke:var(--role-result); stroke-width:1.2; stroke-dasharray:1.6 1.2; }
  </style>
  <rect class="plate" x="2" y="2" width="60" height="60" rx="14"/>
  <svg class="lcm-icon" x="7" y="7" width="50" height="50" viewBox="0 0 24 24">
    <rect class="lcm-icon-a" x="4" y="15" width="6" height="6"/>
    <rect class="lcm-icon-a" x="4" y="9" width="6" height="6"/>
    <rect class="lcm-icon-a" x="4" y="3" width="6" height="6"/>
    <rect class="lcm-icon-b" x="12" y="12" width="9" height="9"/>
    <rect class="lcm-icon-b" x="12" y="3" width="9" height="9"/>
    <path class="lcm-icon-ground" d="M2 21H22"/>
    <path class="lcm-icon-meet" d="M1.5 3H22.5"/>
  </svg>
</svg>
